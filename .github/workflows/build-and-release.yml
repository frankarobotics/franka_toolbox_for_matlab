name: Build and Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]*'  # Triggers on version tags like 1.0.0, 4.0.0, etc.
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 4.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        default: false
        type: boolean

# Note: MATLAB batch licensing token (MLM_LICENSE_TOKEN) is only needed if:
#   - The repository is private, OR
#   - The workflow uses transformation products (MATLAB Coder, MATLAB Compiler)
# For public repos without these products, no token is required.

permissions:
  contents: write  # Required for creating releases and uploading assets

jobs:
  # =============================================================================
  # Job 1: Build server binaries using Docker (amd64 + arm64)
  # =============================================================================
  build-server:
    name: Build Server Binaries (Docker)
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Set up QEMU for ARM64 cross-compilation
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    
    - name: Make build scripts executable
      run: |
        chmod +x docker/build.sh
        chmod +x docker/scripts/*.sh
    
    - name: Build server binaries (amd64 + arm64)
      run: |
        cd docker
        ./build.sh all
    
    - name: Verify build outputs
      run: |
        echo "=== Build Outputs ==="
        ls -la common/*.zip || echo "No common/*.zip files"
        ls -la franka_robot_server/*.tar.gz || echo "No server tar.gz files"
        ls -la dependencies/*.zip || echo "No dependencies/*.zip files"
    
    - name: Upload server artifacts
      uses: actions/upload-artifact@v4
      with:
        name: server-binaries
        path: |
          common/bin.zip
          common/bin_arm.zip
          franka_robot_server/bin.tar.gz
          franka_robot_server/bin_arm.tar.gz
          dependencies/libfranka.zip
          dependencies/libfranka_arm.zip
        retention-days: 7

  # =============================================================================
  # Job 1b: Build server binaries for Gen1 robots (libfranka 0.9.2)
  # =============================================================================
  build-server-gen1:
    name: Build Server Binaries Gen1 (Docker)
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Set up QEMU for ARM64 cross-compilation
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    
    - name: Make build scripts executable
      run: |
        chmod +x docker/build.sh
        chmod +x docker/scripts/*.sh
    
    - name: Build server binaries with libfranka 0.9.2 (amd64 + arm64)
      run: |
        cd docker
        ./build.sh --libfranka 0.9.2
    
    - name: Rename outputs for Gen1
      run: |
        # Rename binaries to distinguish Gen1 from Gen3
        mv common/bin.zip common/bin_gen1.zip || true
        mv common/bin_arm.zip common/bin_arm_gen1.zip || true
        mv franka_robot_server/bin.tar.gz franka_robot_server/bin_gen1.tar.gz || true
        mv franka_robot_server/bin_arm.tar.gz franka_robot_server/bin_arm_gen1.tar.gz || true
        mv dependencies/libfranka.zip dependencies/franka_gen1.zip || true
        mv dependencies/libfranka_arm.zip dependencies/libfranka_arm_gen1.zip || true
    
    - name: Verify build outputs
      run: |
        echo "=== Gen1 Build Outputs ==="
        ls -la common/*_gen1.zip || echo "No common/*_gen1.zip files"
        ls -la franka_robot_server/*_gen1.tar.gz || echo "No server *_gen1.tar.gz files"
        ls -la dependencies/*_gen1.zip || echo "No dependencies/*_gen1.zip files"
    
    - name: Upload Gen1 server artifacts
      uses: actions/upload-artifact@v4
      with:
        name: server-binaries-gen1
        path: |
          common/bin_gen1.zip
          common/bin_arm_gen1.zip
          franka_robot_server/bin_gen1.tar.gz
          franka_robot_server/bin_arm_gen1.tar.gz
          dependencies/franka_gen1.zip
          dependencies/libfranka_arm_gen1.zip
        retention-days: 7

  # =============================================================================
  # Job 2a: Build MEX files on Ubuntu 22.04 with MATLAB R2023a
  # =============================================================================
  build-mex-linux:
    name: Build MEX (Linux R2023a)
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libeigen3-dev
    
    - name: Install Cap'n Proto from source (static libraries)
      run: |
        # Build Cap'n Proto as STATIC libraries for static linking into MEX files
        # This ensures users don't need Cap'n Proto installed
        # PIC flag required for linking into shared objects (MEX files)
        CAPNP_VERSION="1.0.2"
        
        cd /tmp
        curl -O https://capnproto.org/capnproto-c++-${CAPNP_VERSION}.tar.gz
        tar zxf capnproto-c++-${CAPNP_VERSION}.tar.gz
        cd capnproto-c++-${CAPNP_VERSION}
        
        mkdir build && cd build
        cmake \
          -DBUILD_TESTING=OFF \
          -DBUILD_SHARED_LIBS=OFF \
          -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
          -DCMAKE_INSTALL_PREFIX=/usr/local \
          ..
        make -j$(nproc)
        sudo make install
        sudo ldconfig
        
        # Verify static libraries
        capnp --version
        echo "=== Static libraries (for linking into MEX) ==="
        ls -la /usr/local/lib/libcapnp*.a /usr/local/lib/libkj*.a 2>/dev/null || echo "Warning: .a files not found"
        echo "=== Headers ==="
        ls /usr/local/include/capnp/ | head -5
    
    - name: Set up MATLAB R2023a
      uses: matlab-actions/setup-matlab@v2
      with:
        release: R2023a
        products: |
          MATLAB
          Simulink
          MATLAB_Coder
          Simulink_Coder
    
    - name: Build MEX files
      uses: matlab-actions/run-command@v2
      with:
        command: |
          addpath(genpath(pwd));
          fprintf('Building Simulink library MEX files...\n');
          franka_simulink_library_mex();
          fprintf('Building FrankaRobot MEX files...\n');
          franka_robot_mex();
          fprintf('MEX build complete!\n');
    
    - name: Verify MEX outputs
      run: |
        echo "=== MEX Build Outputs ==="
        ls -la franka_robot/*.zip || echo "No franka_robot/*.zip"
        ls -la franka_simulink_library/*.zip || echo "No simulink library *.zip"
        # Show contents of zip files
        unzip -l franka_robot/bin.zip || true
        unzip -l franka_simulink_library/bin.zip || true
    
    - name: Upload Linux MEX artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mex-linux
        path: |
          franka_robot/bin.zip
          franka_simulink_library/bin.zip
        retention-days: 7

  # =============================================================================
  # Job 2b: Build MEX files on Windows with MATLAB R2023a
  # Note: Using windows-2022 because franka_simulink_library_mex.m 
  #       hardcodes "Visual Studio 17 2022" generator
  # =============================================================================
  build-mex-windows:
    name: Build MEX (Windows R2023a)
    runs-on: windows-2022
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build Cap'n Proto from source (static libraries)
      run: |
        # Build Cap'n Proto as STATIC libraries for static linking into MEX files
        # This ensures users don't need to install Cap'n Proto separately
        # Output compatible with Windows 10 and Windows 11
        #
        # Expected directory structure for franka_robot_mex.m:
        # C:\Program Files (x86)\capnproto-c++-win32-1.0.2\capnproto-c++-1.0.2\src\capnp\Release
        # C:\Program Files (x86)\capnproto-c++-win32-1.0.2\capnproto-c++-1.0.2\src\kj\Release
        
        $capnpVersion = "1.0.2"
        $capnpUrl = "https://capnproto.org/capnproto-c++-$capnpVersion.tar.gz"
        $downloadPath = "$env:TEMP\capnproto.tar.gz"
        $extractPath = "$env:TEMP\capnproto-extract"
        $targetDir = "C:\Program Files (x86)\capnproto-c++-win32-$capnpVersion\capnproto-c++-$capnpVersion"
        
        Write-Host "Downloading Cap'n Proto $capnpVersion source..."
        Invoke-WebRequest -Uri $capnpUrl -OutFile $downloadPath
        
        Write-Host "Extracting source..."
        New-Item -ItemType Directory -Path $extractPath -Force | Out-Null
        tar -xzf $downloadPath -C $extractPath
        
        $sourceDir = "$extractPath\capnproto-c++-$capnpVersion"
        
        Write-Host "Building Cap'n Proto as STATIC libraries..."
        $buildDir = "$sourceDir\build"
        New-Item -ItemType Directory -Path $buildDir -Force | Out-Null
        
        cd $buildDir
        # BUILD_SHARED_LIBS=OFF ensures static libraries for static linking
        cmake -G "Visual Studio 17 2022" -A x64 `
              -DBUILD_TESTING=OFF `
              -DBUILD_SHARED_LIBS=OFF `
              ..
        cmake --build . --config Release --parallel
        
        Write-Host "Setting up expected directory structure..."
        New-Item -ItemType Directory -Path "$targetDir\src\capnp\Release" -Force | Out-Null
        New-Item -ItemType Directory -Path "$targetDir\src\kj\Release" -Force | Out-Null
        
        # Copy headers
        Copy-Item -Path "$sourceDir\src\capnp" -Destination "$targetDir\src\" -Recurse -Force
        Copy-Item -Path "$sourceDir\src\kj" -Destination "$targetDir\src\" -Recurse -Force
        
        # Copy static libraries (.lib)
        Copy-Item -Path "$buildDir\src\capnp\Release\*.lib" -Destination "$targetDir\src\capnp\Release\" -Force
        Copy-Item -Path "$buildDir\src\kj\Release\*.lib" -Destination "$targetDir\src\kj\Release\" -Force
        
        # Copy tools to bin and add to PATH
        $binDir = "$targetDir\bin"
        New-Item -ItemType Directory -Path $binDir -Force | Out-Null
        Copy-Item -Path "$buildDir\src\capnp\Release\capnp.exe" -Destination $binDir -Force
        Copy-Item -Path "$buildDir\src\capnp\Release\capnpc-c++.exe" -Destination $binDir -Force
        echo $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        
        Write-Host "Verifying static libraries..."
        & "$binDir\capnp.exe" --version
        Get-ChildItem -Path "$targetDir\src\capnp\Release\*.lib" | ForEach-Object { Write-Host "Static lib: $($_.Name) ($($_.Length) bytes)" }
        Get-ChildItem -Path "$targetDir\src\kj\Release\*.lib" | ForEach-Object { Write-Host "Static lib: $($_.Name) ($($_.Length) bytes)" }
      shell: pwsh
    
    - name: Set up MATLAB R2023a
      uses: matlab-actions/setup-matlab@v2
      with:
        release: R2023a
        products: |
          MATLAB
          Simulink
          MATLAB_Coder
          Simulink_Coder
    
    - name: Build MEX files
      uses: matlab-actions/run-command@v2
      with:
        command: |
          addpath(genpath(pwd));
          fprintf('Building Simulink library MEX files...\n');
          franka_simulink_library_mex();
          fprintf('Building FrankaRobot MEX files...\n');
          franka_robot_mex();
          fprintf('MEX build complete!\n');
    
    - name: Verify MEX outputs
      run: |
        Write-Host "=== MEX Build Outputs ==="
        Get-ChildItem -Path "franka_robot" -Filter "*.zip" -ErrorAction SilentlyContinue
        Get-ChildItem -Path "franka_simulink_library" -Filter "*.zip" -ErrorAction SilentlyContinue
      shell: pwsh
    
    - name: Upload Windows MEX artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mex-windows
        path: |
          franka_robot/bin.zip
          franka_simulink_library/bin.zip
        retention-days: 7

  # =============================================================================
  # Job 3: Merge artifacts and create distribution packages
  # =============================================================================
  package:
    name: Package Distribution
    runs-on: ubuntu-22.04
    needs: [build-server, build-server-gen1, build-mex-linux, build-mex-windows]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Download server artifacts (Gen3 - libfranka from config)
      uses: actions/download-artifact@v4
      with:
        name: server-binaries
        path: .
    
    - name: Download Linux MEX artifacts
      uses: actions/download-artifact@v4
      with:
        name: mex-linux
        path: mex-linux
    
    - name: Download Windows MEX artifacts
      uses: actions/download-artifact@v4
      with:
        name: mex-windows
        path: mex-windows
    
    - name: Merge MEX artifacts
      run: |
        # Create temp directories for merging
        mkdir -p merge_franka_robot
        mkdir -p merge_simulink_lib
        
        # Extract Linux MEX files
        if [ -f "mex-linux/franka_robot/bin.zip" ]; then
          unzip -o "mex-linux/franka_robot/bin.zip" -d merge_franka_robot/
        fi
        if [ -f "mex-linux/franka_simulink_library/bin.zip" ]; then
          unzip -o "mex-linux/franka_simulink_library/bin.zip" -d merge_simulink_lib/
        fi
        
        # Extract Windows MEX files (will overwrite same-named files, but extensions differ)
        if [ -f "mex-windows/franka_robot/bin.zip" ]; then
          unzip -o "mex-windows/franka_robot/bin.zip" -d merge_franka_robot/
        fi
        if [ -f "mex-windows/franka_simulink_library/bin.zip" ]; then
          unzip -o "mex-windows/franka_simulink_library/bin.zip" -d merge_simulink_lib/
        fi
        
        # Create merged zip files
        cd merge_franka_robot && zip -r ../franka_robot/bin.zip . && cd ..
        cd merge_simulink_lib && zip -r ../franka_simulink_library/bin.zip . && cd ..
        
        # Verify merged contents
        echo "=== Merged franka_robot/bin.zip ==="
        unzip -l franka_robot/bin.zip
        echo "=== Merged franka_simulink_library/bin.zip ==="
        unzip -l franka_simulink_library/bin.zip
        
        # Cleanup
        rm -rf merge_franka_robot merge_simulink_lib mex-linux mex-windows
    
    - name: Set up MATLAB R2024a
      uses: matlab-actions/setup-matlab@v2
      with:
        release: R2024a
        products: |
          MATLAB
          Simulink
          MATLAB_Coder
          Simulink_Coder
    
    - name: Read Gen3 libfranka version from config
      id: libfranka-version
      run: |
        GEN3_LIBFRANKA_VERSION=$(sed -n '1p' config/libfranka_ver.csv | tr -d '\r')
        if [ -z "$GEN3_LIBFRANKA_VERSION" ]; then
          echo "config/libfranka_ver.csv is empty"
          exit 1
        fi
        echo "GEN3_LIBFRANKA_VERSION=$GEN3_LIBFRANKA_VERSION" >> $GITHUB_ENV
        echo "gen3_version=$GEN3_LIBFRANKA_VERSION" >> $GITHUB_OUTPUT
        echo "Using Gen3 libfranka version: $GEN3_LIBFRANKA_VERSION"

    - name: Create Gen3 distribution package (franka-fr3.mltbx)
      uses: matlab-actions/run-command@v2
      with:
        command: |
          addpath(genpath(pwd));
          gen3LibfrankaVersion = getenv('GEN3_LIBFRANKA_VERSION');
          fprintf('Creating Gen3 distribution package (libfranka %s)...\n', gen3LibfrankaVersion);
          franka_toolbox_dist_make('Mode', 'ci', 'OutputName', 'franka-fr3');
          fprintf('Gen3 distribution package created!\n');
    
    - name: Download server artifacts (Gen1 - libfranka 0.9.2)
      uses: actions/download-artifact@v4
      with:
        name: server-binaries-gen1
        path: gen1-binaries
    
    - name: Swap in Gen1 binaries for Gen1 package
      run: |
        echo "=== Swapping in Gen1 binaries (libfranka 0.9.2) ==="
        
        # Replace with Gen1 binaries (franka_toolbox_dist_make preserves existing .mltbx in CI mode)
        cp gen1-binaries/common/bin_gen1.zip common/bin.zip
        cp gen1-binaries/common/bin_arm_gen1.zip common/bin_arm.zip
        cp gen1-binaries/franka_robot_server/bin_gen1.tar.gz franka_robot_server/bin.tar.gz
        cp gen1-binaries/franka_robot_server/bin_arm_gen1.tar.gz franka_robot_server/bin_arm.tar.gz
        cp gen1-binaries/dependencies/franka_gen1.zip dependencies/libfranka.zip
        cp gen1-binaries/dependencies/libfranka_arm_gen1.zip dependencies/libfranka_arm.zip
        
        echo "Gen1 binaries swapped in successfully"
        
        # Cleanup: remove temporary Gen1 artifacts folder
        rm -rf gen1-binaries
        echo "Cleaned up gen1-binaries folder"
    
    - name: Create Gen1 distribution package (franka-fer.mltbx)
      uses: matlab-actions/run-command@v2
      with:
        command: |
          addpath(genpath(pwd));
          fprintf('Creating Gen1 distribution package (libfranka 0.9.2)...\n');
          franka_toolbox_dist_make('Mode', 'ci', 'OutputName', 'franka-fer');
          fprintf('Gen1 distribution package created!\n');
    
    - name: Verify distribution outputs
      run: |
        echo "=== Distribution Outputs ==="
        ls -la dist/
        
        if [ -f "dist/franka-fr3.mltbx" ]; then
          echo "✓ franka-fr3.mltbx (Gen3) created successfully"
          du -h dist/franka-fr3.mltbx
        else
          echo "✗ franka-fr3.mltbx not found!"
          exit 1
        fi
        
        if [ -f "dist/franka-fer.mltbx" ]; then
          echo "✓ franka-fer.mltbx (Gen1) created successfully"
          du -h dist/franka-fer.mltbx
        else
          echo "✗ franka-fer.mltbx not found!"
          exit 1
        fi

    - name: Upload distribution artifacts
      uses: actions/upload-artifact@v4
      with:
        name: distribution
        path: |
          dist/franka-fr3.mltbx
          dist/franka-fer.mltbx
        retention-days: 30

  # =============================================================================
  # Job 4: Create GitHub Release
  # =============================================================================
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: package
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
        else
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
        fi

    - name: Read Gen3 libfranka version from config
      id: libfranka-version
      run: |
        GEN3_LIBFRANKA_VERSION=$(sed -n '1p' config/libfranka_ver.csv | tr -d '\r')
        if [ -z "$GEN3_LIBFRANKA_VERSION" ]; then
          echo "config/libfranka_ver.csv is empty"
          exit 1
        fi
        echo "gen3_version=$GEN3_LIBFRANKA_VERSION" >> $GITHUB_OUTPUT
        echo "Using Gen3 libfranka version: $GEN3_LIBFRANKA_VERSION"
    
    - name: Download distribution artifact
      uses: actions/download-artifact@v4
      with:
        name: distribution
        path: dist
    
    - name: Verify distribution files
      id: check-dist
      run: |
        echo "=== Checking distribution files ==="
        ls -la dist/
        
        if [ -f "dist/franka-fr3.mltbx" ]; then
          echo "gen3_exists=true" >> $GITHUB_OUTPUT
          echo "gen3_size=$(du -h dist/franka-fr3.mltbx | cut -f1)" >> $GITHUB_OUTPUT
          echo "✓ franka-fr3.mltbx found"
        else
          echo "gen3_exists=false" >> $GITHUB_OUTPUT
          echo "✗ franka-fr3.mltbx not found!"
          exit 1
        fi
        
        if [ -f "dist/franka-fer.mltbx" ]; then
          echo "gen1_exists=true" >> $GITHUB_OUTPUT
          echo "gen1_size=$(du -h dist/franka-fer.mltbx | cut -f1)" >> $GITHUB_OUTPUT
          echo "✓ franka-fer.mltbx found"
        else
          echo "gen1_exists=false" >> $GITHUB_OUTPUT
          echo "✗ franka-fer.mltbx not found!"
          exit 1
        fi
    
    - name: Extract changelog entry
      id: changelog
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        
        if [ ! -f "CHANGELOG.md" ]; then
          echo "CHANGELOG.md not found, creating basic release notes"
          cat > VERSION_CHANGELOG.md << EOF
        ## What's New
        
        Release $VERSION of Franka Toolbox for MATLAB.
        EOF
        else
          echo "Extracting latest changelog entry from CHANGELOG.md"
          
          # Extract the first (latest) changelog entry: from first "## " to the next "## " or EOF
          # This is more robust than matching exact version numbers
          awk '/^## [0-9]/{if(found) exit; found=1} found{print}' CHANGELOG.md > VERSION_CHANGELOG.md
          
          if [ -s VERSION_CHANGELOG.md ] && [ $(wc -l < VERSION_CHANGELOG.md) -gt 1 ]; then
            echo "Successfully extracted latest changelog entry:"
            head -3 VERSION_CHANGELOG.md
          else
            echo "Could not extract changelog, using fallback"
            cat > VERSION_CHANGELOG.md << EOF
        ## What's New
        
        Release $VERSION of Franka Toolbox for MATLAB.
        EOF
          fi
        fi
        
        # Build the full release notes
        cat > RELEASE_NOTES.md << EOF
        $(cat VERSION_CHANGELOG.md)
        
        ## Installation
        
        Choose the appropriate package for your robot:
        
        | Package | Robot | libfranka Version |
        |---------|-------|-------------------|
        | \`franka-fr3.mltbx\` | FR3 | ${{ steps.libfranka-version.outputs.gen3_version }} |
        | \`franka-fer.mltbx\` | FER | 0.9.2 |

        To install, either:
        1. Double-click the \`.mltbx\` file, or
        2. In MATLAB, go to **Home** > **Add-Ons** > **Install Add-On** and select the file

        ## Documentation

        For detailed documentation, examples, and API reference, visit: [Franka Toolbox for MATLAB Documentation](https://frankarobotics.github.io/docs/franka_toolbox_for_matlab/docs/franka_matlab/index.html)
        
        ## Build Information
        
        | Package | Size | libfranka |
        |---------|------|-----------|
        | franka-fr3.mltbx | ${{ steps.check-dist.outputs.gen3_size }} | ${{ steps.libfranka-version.outputs.gen3_version }} |
        | franka-fer.mltbx | ${{ steps.check-dist.outputs.gen1_size }} | 0.9.2 |
        
        - **Version**: $VERSION
        - **MEX Platforms**: Linux (R2023a), Windows (R2023a)
        - **Target Architectures**: x86_64, ARM64
        EOF
        
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        cat RELEASE_NOTES.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.version.outputs.version }}
        name: Franka Toolbox for MATLAB ${{ steps.version.outputs.version }}
        body: ${{ steps.changelog.outputs.changelog }}
        draft: false
        prerelease: ${{ github.event.inputs.prerelease || false }}
        files: |
          dist/franka-fr3.mltbx
          dist/franka-fer.mltbx
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Summary
      run: |
        echo "## Release Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Version**: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Release URL**: https://github.com/${{ github.repository }}/releases/tag/${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Pre-release**: ${{ github.event.inputs.prerelease || false }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Distribution Packages" >> $GITHUB_STEP_SUMMARY
        echo "| Package | Size | Robot |" >> $GITHUB_STEP_SUMMARY
        echo "|---------|------|-------|" >> $GITHUB_STEP_SUMMARY
