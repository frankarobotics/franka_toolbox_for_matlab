name: CI Build

on:
  push:
    branches: [ main, 'rc/**', 'dev/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      build_server:
        description: 'Build server binaries (Docker)'
        required: false
        default: true
        type: boolean
      build_mex_linux:
        description: 'Build Linux MEX files'
        required: false
        default: true
        type: boolean
      build_mex_windows:
        description: 'Build Windows MEX files'
        required: false
        default: true
        type: boolean

# Note: MATLAB batch licensing token (MLM_LICENSE_TOKEN) is only needed if:
#   - The repository is private, OR
#   - The workflow uses transformation products (MATLAB Coder, MATLAB Compiler)
# For public repos without these products, no token is required.

jobs:
  # =============================================================================
  # Build server binaries using Docker
  # =============================================================================
  build-server:
    name: Server Binaries (Docker)
    runs-on: ubuntu-22.04
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_server == 'true' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Set up QEMU for ARM64
      uses: docker/setup-qemu-action@v3
      with:
        platforms: arm64
    
    - name: Make scripts executable
      run: |
        chmod +x docker/build.sh
        chmod +x docker/scripts/*.sh
    
    - name: Build server binaries
      run: |
        cd docker
        ./build.sh all
    
    - name: Verify outputs
      run: |
        echo "=== Build Outputs ==="
        ls -la common/*.zip 2>/dev/null || echo "No common/*.zip"
        ls -la franka_robot_server/*.tar.gz 2>/dev/null || echo "No server tar.gz"
        ls -la dependencies/*.zip 2>/dev/null || echo "No dependencies/*.zip"
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: server-binaries
        path: |
          common/bin.zip
          common/bin_arm.zip
          franka_robot_server/bin.tar.gz
          franka_robot_server/bin_arm.tar.gz
          dependencies/libfranka.zip
          dependencies/libfranka_arm.zip
        retention-days: 7

  # =============================================================================
  # Build MEX files on Ubuntu 22.04 with MATLAB R2023a
  # =============================================================================
  build-mex-linux:
    name: MEX Linux (R2023a)
    runs-on: ubuntu-22.04
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_mex_linux == 'true' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential libeigen3-dev
    
    - name: Install Cap'n Proto from source (static libraries)
      run: |
        # Build as STATIC libraries for static linking into MEX files
        # PIC flag required for linking into shared objects (MEX files)
        CAPNP_VERSION="1.0.2"
        cd /tmp
        curl -O https://capnproto.org/capnproto-c++-${CAPNP_VERSION}.tar.gz
        tar zxf capnproto-c++-${CAPNP_VERSION}.tar.gz
        cd capnproto-c++-${CAPNP_VERSION}
        mkdir build && cd build
        cmake -DBUILD_TESTING=OFF -DBUILD_SHARED_LIBS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_INSTALL_PREFIX=/usr/local ..
        make -j$(nproc)
        sudo make install
        sudo ldconfig
        capnp --version
        ls -la /usr/local/lib/libcapnp*.a /usr/local/lib/libkj*.a 2>/dev/null || true
    
    - name: Set up MATLAB R2023a
      uses: matlab-actions/setup-matlab@v2
      with:
        release: R2023a
        products: |
          MATLAB
          Simulink
          MATLAB_Coder
          Simulink_Coder
    
    - name: Build MEX files
      uses: matlab-actions/run-command@v2
      with:
        command: |
          addpath(genpath(pwd));
          fprintf('Building Simulink library MEX files...\n');
          franka_toolbox_simulink_library_mex();
          fprintf('Building FrankaRobot MEX files...\n');
          franka_robot_mex();
          fprintf('MEX build complete!\n');
    
    - name: Verify outputs
      run: |
        echo "=== MEX Build Outputs ==="
        ls -la franka_robot/*.zip 2>/dev/null || echo "No franka_robot/*.zip"
        ls -la franka_toolbox_simulink_library/*.zip 2>/dev/null || echo "No simulink *.zip"
        unzip -l franka_robot/bin.zip 2>/dev/null || true
        unzip -l franka_toolbox_simulink_library/bin.zip 2>/dev/null || true
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mex-linux
        path: |
          franka_robot/bin.zip
          franka_toolbox_simulink_library/bin.zip
        retention-days: 7

  # =============================================================================
  # Build MEX files on Windows with MATLAB R2023a
  # Note: Using windows-2022 because franka_toolbox_simulink_library_mex.m 
  #       hardcodes "Visual Studio 17 2022" generator
  # =============================================================================
  build-mex-windows:
    name: MEX Windows (R2023a)
    runs-on: windows-2022
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.build_mex_windows == 'true' }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build Cap'n Proto from source (static libraries)
      run: |
        # Build Cap'n Proto as STATIC libraries for static linking into MEX files
        # Ensures users don't need Cap'n Proto installed; compatible with Win10/Win11
        $capnpVersion = "1.0.2"
        $capnpUrl = "https://capnproto.org/capnproto-c++-$capnpVersion.tar.gz"
        $downloadPath = "$env:TEMP\capnproto.tar.gz"
        $extractPath = "$env:TEMP\capnproto-extract"
        $targetDir = "C:\Program Files (x86)\capnproto-c++-win32-$capnpVersion\capnproto-c++-$capnpVersion"
        
        Write-Host "Downloading Cap'n Proto $capnpVersion source..."
        Invoke-WebRequest -Uri $capnpUrl -OutFile $downloadPath
        
        Write-Host "Extracting source..."
        New-Item -ItemType Directory -Path $extractPath -Force | Out-Null
        tar -xzf $downloadPath -C $extractPath
        
        $sourceDir = "$extractPath\capnproto-c++-$capnpVersion"
        $buildDir = "$sourceDir\build"
        New-Item -ItemType Directory -Path $buildDir -Force | Out-Null
        
        cd $buildDir
        # BUILD_SHARED_LIBS=OFF for static linking
        cmake -G "Visual Studio 17 2022" -A x64 -DBUILD_TESTING=OFF -DBUILD_SHARED_LIBS=OFF ..
        cmake --build . --config Release --parallel
        
        Write-Host "Setting up expected directory structure..."
        New-Item -ItemType Directory -Path "$targetDir\src\capnp\Release" -Force | Out-Null
        New-Item -ItemType Directory -Path "$targetDir\src\kj\Release" -Force | Out-Null
        
        Copy-Item -Path "$sourceDir\src\capnp" -Destination "$targetDir\src\" -Recurse -Force
        Copy-Item -Path "$sourceDir\src\kj" -Destination "$targetDir\src\" -Recurse -Force
        Copy-Item -Path "$buildDir\src\capnp\Release\*.lib" -Destination "$targetDir\src\capnp\Release\" -Force
        Copy-Item -Path "$buildDir\src\kj\Release\*.lib" -Destination "$targetDir\src\kj\Release\" -Force
        
        $binDir = "$targetDir\bin"
        New-Item -ItemType Directory -Path $binDir -Force | Out-Null
        Copy-Item -Path "$buildDir\src\capnp\Release\capnp.exe" -Destination $binDir -Force
        Copy-Item -Path "$buildDir\src\capnp\Release\capnpc-c++.exe" -Destination $binDir -Force
        echo $binDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        
        & "$binDir\capnp.exe" --version
      shell: pwsh
    
    - name: Set up MATLAB R2023a
      uses: matlab-actions/setup-matlab@v2
      with:
        release: R2023a
        products: |
          MATLAB
          Simulink
          MATLAB_Coder
          Simulink_Coder
    
    - name: Build MEX files
      uses: matlab-actions/run-command@v2
      with:
        command: |
          addpath(genpath(pwd));
          fprintf('Building Simulink library MEX files...\n');
          franka_toolbox_simulink_library_mex();
          fprintf('Building FrankaRobot MEX files...\n');
          franka_robot_mex();
          fprintf('MEX build complete!\n');
    
    - name: Verify outputs
      run: |
        Write-Host "=== MEX Build Outputs ==="
        Get-ChildItem -Path "franka_robot" -Filter "*.zip" -ErrorAction SilentlyContinue
        Get-ChildItem -Path "franka_toolbox_simulink_library" -Filter "*.zip" -ErrorAction SilentlyContinue
      shell: pwsh
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mex-windows
        path: |
          franka_robot/bin.zip
          franka_toolbox_simulink_library/bin.zip
        retention-days: 7

  # =============================================================================
  # Build status summary
  # =============================================================================
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-server, build-mex-linux, build-mex-windows]
    if: always()
    
    steps:
    - name: Check build results
      run: |
        echo "## CI Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.build-server.result }}" == "success" ]; then
          echo "- ✅ Server Binaries (Docker)" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.build-server.result }}" == "skipped" ]; then
          echo "- ⏭️ Server Binaries (Docker) - Skipped" >> $GITHUB_STEP_SUMMARY
        else
          echo "- ❌ Server Binaries (Docker) - ${{ needs.build-server.result }}" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.build-mex-linux.result }}" == "success" ]; then
          echo "- ✅ MEX Linux (R2023a)" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.build-mex-linux.result }}" == "skipped" ]; then
          echo "- ⏭️ MEX Linux (R2023a) - Skipped" >> $GITHUB_STEP_SUMMARY
        else
          echo "- ❌ MEX Linux (R2023a) - ${{ needs.build-mex-linux.result }}" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ "${{ needs.build-mex-windows.result }}" == "success" ]; then
          echo "- ✅ MEX Windows (R2023a, VS2022)" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.build-mex-windows.result }}" == "skipped" ]; then
          echo "- ⏭️ MEX Windows (R2023a, VS2022) - Skipped" >> $GITHUB_STEP_SUMMARY
        else
          echo "- ❌ MEX Windows (R2023a, VS2022) - ${{ needs.build-mex-windows.result }}" >> $GITHUB_STEP_SUMMARY
        fi

